<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<title>Buaze Owner Panel — Pulse 2026 Redesign</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #F4F4F4; }
  #root { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="page-system.jsx"></script>
<script type="text/babel" src="page-dashboard.jsx"></script>
<script type="text/babel" src="page-reviews.jsx"></script>
<script type="text/babel" src="page-google.jsx"></script>
<script type="text/babel" src="page-platforms.jsx"></script>
<script type="text/babel" src="page-account.jsx"></script>
<script type="text/babel" src="page-analytics.jsx"></script>
<script type="text/babel" src="page-customers.jsx"></script>
<script type="text/babel" src="page-mobile.jsx"></script>
<script type="text/babel" src="page-mobile-v2.jsx"></script>

<script type="text/babel" data-presets="react">
const App = () => (
  <DesignCanvas title="Buaze Owner Panel — Pulse 2026 Redesign">
    <DCSection id="system" title="00 · Tasarım Sistemi">
      <DCArtboard id="sys-overview" label="Pulse System Overview" width={1280} height={1100}>
        <SystemPage/>
      </DCArtboard>
    </DCSection>

    <DCSection id="desktop" title="Masaüstü · 1440 × 900">
      <DCArtboard id="d-dashboard" label="00 · Genel Bakış (Dashboard)" width={1440} height={1320}>
        <DashboardPage/>
      </DCArtboard>
      <DCArtboard id="d-dashboard-collapsed" label="00b · Dashboard · Sidebar Daraltılmış" width={1440} height={1320}>
        <DashboardPage defaultCollapsed={true}/>
      </DCArtboard>
      <DCArtboard id="d-reviews" label="01 · Yorumlar (Inbox)" width={1440} height={900}>
        <ReviewsPage/>
      </DCArtboard>
      <DCArtboard id="d-google" label="02 · Google Yorumları" width={1440} height={1280}>
        <GooglePage/>
      </DCArtboard>
      <DCArtboard id="d-platforms" label="03 · Platform Bağlantıları" width={1440} height={1480}>
        <PlatformsPage/>
      </DCArtboard>
      <DCArtboard id="d-account" label="04 · Hesabım" width={1440} height={1240}>
        <AccountPage/>
      </DCArtboard>
      <DCArtboard id="d-analytics" label="05 · Analitik" width={1440} height={1620}>
        <AnalyticsPage/>
      </DCArtboard>
      <DCArtboard id="d-customers" label="06 · Müşteriler · CRM" width={1440} height={920}>
        <CustomersPage/>
      </DCArtboard>
    </DCSection>

    <DCSection id="mobile" title="Mobil · iPhone 14 Pro (414 × 880)">
      <DCArtboard id="m-dashboard" label="Mobil · Genel Bakış" width={438} height={904}>
        <MobileDashboard/>
      </DCArtboard>
      <DCArtboard id="m-dashboard-drawer" label="Mobil · Drawer Açık" width={438} height={904}>
        <MobileDashboard withDrawer={true}/>
      </DCArtboard>
      <DCArtboard id="m-reviews-v2" label="Mobil · Yorumlar v2" width={438} height={904}>
        <MobileReviewsV2/>
      </DCArtboard>
      <DCArtboard id="m-google" label="Mobil · Google Yorumları" width={438} height={904}>
        <MobileGoogle/>
      </DCArtboard>
      <DCArtboard id="m-analytics" label="Mobil · Analitik" width={438} height={904}>
        <MobileAnalytics/>
      </DCArtboard>
      <DCArtboard id="m-customers" label="Mobil · Müşteriler" width={438} height={904}>
        <MobileCustomers/>
      </DCArtboard>
      <DCArtboard id="m-account" label="Mobil · Hesabım" width={438} height={904}>
        <MobileAccount/>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
