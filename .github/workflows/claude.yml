# Claude assistant — runs when someone writes "@claude" in an issue, a PR
# comment or a PR review. Claude answers the question or makes the requested
# change and pushes it. Only users with write access to the repo can trigger
# it (the action checks this itself).
#
# Setup: organization secret ANTHROPIC_API_KEY (okanberk-dev → Settings →
# Secrets and variables → Actions, shared with all repositories).
#
# The workflow passes its own GITHUB_TOKEN, so the Claude GitHub App does not
# need to be installed. Side effect: commits Claude pushes with this token do
# not trigger other workflows (CI) — push an empty commit or re-run CI by hand.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Lets Claude read CI results on the PR it is working on.
          additional_permissions: |
            actions: read
