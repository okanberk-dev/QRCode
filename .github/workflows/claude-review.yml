# Claude review — automatic code review when a PR is opened, reopened or
# marked ready for review. Later pushes are not re-reviewed automatically
# (keeps API cost down); write "@claude review again" on the PR for that
# (handled by claude.yml).
#
# Draft PRs and PRs from forks are skipped (forks do not get secrets).
#
# Setup: organization secret ANTHROPIC_API_KEY (see claude.yml).
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in
            the current working directory. Follow the project conventions in
            CLAUDE.md.

            Focus on:
            - Bugs and logic errors
            - Security issues (auth, input validation, secrets, data exposure)
            - Prisma / database changes that could break production
            - Performance problems

            Skip style nitpicks that ESLint or TypeScript already catch.

            Write the review in Turkish.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues on specific lines, and `gh pr comment`
            for one short summary comment. Only post GitHub comments; do not
            put the review in your final message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
