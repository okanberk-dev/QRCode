Buaze QRCode owner/admin panel stage closure audit yapar. Kullanıcı tamamlanmış PR'ları ("Stage 11-14 audit et", "son 4 PR kontrol et", "PR #491-#494 doğrula") veya AGENTS.md §38.X loglarını gerçek kod ile cross-check istediğinde tetiklenir. Branch açar, drift tespit eder, lint/tsc/test/build koşar, bulguları yeni §38.X closure log olarak AGENTS.md'ye ekler.

Use this agent proactively when:
- User asks "kontrol et / audit et / doğrula / verify"
- Multiple stages have just been completed (3+ §38.X logs in recent commits)
- User mentions specific PR numbers or stage ranges
- User wants drift/regression check between docs and code

Do NOT use this agent for:
