<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Buaze · Social Kit</title>
<meta name="viewport" content="width=1440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #F5F5F5; font-family: 'Inter', system-ui, sans-serif; }
  #root { min-height: 100vh; }

  /* Asset frames */
  .asset {
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.06);
    font-family: 'Inter Tight', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .asset-1080 { width: 1080px; height: 1080px; }
  .asset-og-w { width: 1200px; height: 630px; }
  .asset-pp { width: 1080px; height: 1080px; border-radius: 50%; }

  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: 'ss01'; letter-spacing: -0.01em; }
  .tight { font-family: 'Inter Tight', sans-serif; }
  .nrm { font-family: 'Inter', sans-serif; }

  /* Subtle grid texture for dark posts */
  .grid-bg::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .grid-bg-light::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* Inline-editable text */
  [contenteditable="true"]:focus { outline: 2px solid #C6F24E; outline-offset: 4px; border-radius: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="social-kit.jsx"></script>
</body>
</html>
